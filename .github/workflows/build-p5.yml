name: Build Cudy P5 firmware

on:
  workflow_dispatch:

env:
  SOURCE_REPOSITORY: MayorBug/openwrt
  SOURCE_REF: cudy-p5-ubootmod

permissions:
  contents: read

concurrency:
  group: p5-firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out the builder
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check out OpenWrt
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_REF }}
          path: openwrt
          fetch-depth: 0
          persist-credentials: false

      - name: Install OpenWrt build dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git glibc-source libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev
          df -h /

      - name: Configure both P5 profiles
        run: .github/ci/p5/prepare.sh openwrt

      - name: Build firmware
        working-directory: openwrt
        run: make -j"$(nproc)"

      - name: Collect images and checksums
        working-directory: openwrt/bin/targets/qualcommax/ipq50xx
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p5-artifacts"

          collect() {
            if [[ ! -s "$1" ]]; then
              echo "::error::Missing or empty build output: $1"
              exit 1
            fi
            cp "$1" "$RUNNER_TEMP/p5-artifacts/"
          }

          for profile in cudy_p5 cudy_p5-ubootmod; do
            for suffix in squashfs-sysupgrade.bin squashfs-factory.ubi initramfs-uImage.itb; do
              collect "openwrt-qualcommax-ipq50xx-$profile-$suffix"
            done
          done

          # OpenWrt emits one target manifest for a multi-profile build.
          manifest=openwrt-qualcommax-ipq50xx.manifest
          collect "$manifest"
          for package in wwand luci-mod-dashboard luci-theme-shadcn; do
            if ! grep -q "^$package - " "$manifest"; then
              echo "::error::Missing package in $manifest: $package"
              exit 1
            fi
          done
          for file in config.buildinfo feeds.buildinfo version.buildinfo; do
            collect "$file"
          done
          cd "$RUNNER_TEMP/p5-artifacts"
          printf 'repository=%s\nref=%s\nsource_commit=%s\nbuilder_commit=%s\n' \
            "$SOURCE_REPOSITORY" "$SOURCE_REF" \
            "$(git -C "$GITHUB_WORKSPACE/openwrt" rev-parse HEAD)" "$GITHUB_SHA" > source.buildinfo
          sha256sum ./* > SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: cudy-p5-firmware
          path: ${{ runner.temp }}/p5-artifacts/
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ runner.temp }}/p5-artifacts
        run: |
          set -euo pipefail
          tag="p5-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          notes=$(mktemp)
          {
            printf 'Firmware for the stock dual-slot and full NAND layouts.\n\n'
            printf 'See the README for image selection and installation.\n\n'
            printf '```text\n'
            cat source.buildinfo
            printf '```\n\n'
            printf 'Build log: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > "$notes"
          gh release create "$tag" ./* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --latest \
            --title "Cudy P5 firmware #${GITHUB_RUN_NUMBER} (attempt ${GITHUB_RUN_ATTEMPT})" \
            --notes-file "$notes"
